<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomials</title>
<style>
  :root {
    --ink: #0c0c10;
    --paper: #f4f2ed;
    --accent: #ff5a36;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(12, 12, 16, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  header .title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--paper);
  }

  header .chapter {
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  main img {
    display: block;
    width: 100%;
    height: auto;
  }

  .end-marker {
    padding: 48px 24px 80px;
    text-align: center;
    font-size: 13px;
    color: rgba(244, 242, 237, 0.5);
    letter-spacing: 0.04em;
  }

  .end-marker span {
    display: block;
    width: 28px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto 16px;
  }
</style>
</head>
<body>

<header>
  <span class="title">Polynomials</span>
  <span class="chapter">Ch. 01</span>
</header>

<main id="pages"></main>

<div class="end-marker" id="end-marker" style="display:none;">
  <span></span>
  End of Chapter 1
</div>

<script>
  // ⬇️ Set these two to match your repo
  const GITHUB_USER = "mr-bubs";
  const GITHUB_REPO = "Polynomials";
  const FOLDER = "pages";
  const IMAGE_EXTENSIONS = [".jpg", ".jpeg", ".png", ".webp"];

  async function loadPages() {
    const main = document.getElementById("pages");
    const endMarker = document.getElementById("end-marker");

    try {
      const res = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER}`
      );
      if (!res.ok) throw new Error("Could not read pages folder");
      const files = await res.json();

      const images = files
        .filter(f => IMAGE_EXTENSIONS.some(ext => f.name.toLowerCase().endsWith(ext)))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

      if (images.length === 0) {
        main.innerHTML = `<div class="end-marker"><span></span>No pages yet</div>`;
        return;
      }

      images.forEach(file => {
        const img = document.createElement("img");
        img.src = file.download_url;
        img.alt = file.name;
        img.loading = "lazy";
        main.appendChild(img);
      });

      endMarker.style.display = "block";
    } catch (err) {
      main.innerHTML = `<div class="end-marker"><span></span>Couldn't load pages — check GITHUB_USER/GITHUB_REPO in the script.</div>`;
      console.error(err);
    }
  }

  loadPages();
</script>

</body>
</html>
